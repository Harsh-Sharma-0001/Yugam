services:
  redis:
    image: redis:7-alpine
    container_name: yugam-redis
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: yugam-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - AUTH_SERVICE_URL=http://auth:8001
      - RESUME_SERVICE_URL=http://resume:8002
      - INTERVIEW_SERVICE_URL=http://interview:8003
      - ROADMAP_SERVICE_URL=http://roadmap:8004
      - BILLING_SERVICE_URL=http://billing:8005
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET:?}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?}
    depends_on:
      redis:
        condition: service_healthy
      auth:
        condition: service_started
      interview:
        condition: service_started

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: yugam-auth
    restart: unless-stopped
    expose:
      - "8001"
    environment:
      - PORT=8001
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - MONGODB_URL=${MONGODB_URL_AUTH:-${MONGODB_URL_USER:-${MONGODB_URL:-mongodb://mongo:27017/user}}}
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET:?}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?}
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      - ALLOW_SELF_ROLE_SIGNUP=${ALLOW_SELF_ROLE_SIGNUP:-true}
      - BOOTSTRAP_ADMIN_EMAILS=${BOOTSTRAP_ADMIN_EMAILS:-}
      - BOOTSTRAP_TRAINER_EMAILS=${BOOTSTRAP_TRAINER_EMAILS:-}
    depends_on:
      redis:
        condition: service_healthy

  resume:
    build:
      context: .
      dockerfile: services/resume/Dockerfile
    container_name: yugam-resume
    restart: unless-stopped
    expose:
      - "8002"
    environment:
      - PORT=8002
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - MONGODB_URL=${MONGODB_URL_RESUME:-${MONGODB_URL:-mongodb://mongo:27017/resume}}
      - AUTH_SERVICE_URL=http://auth:8001
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET:?}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?}
    depends_on:
      redis:
        condition: service_healthy
      auth:
        condition: service_started

  interview:
    build:
      context: .
      dockerfile: services/interview/Dockerfile
    container_name: yugam-interview
    restart: unless-stopped
    expose:
      - "8003"
    environment:
      - PORT=8003
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - MONGODB_URL=${MONGODB_URL_INTERVIEW:-${MONGODB_URL:-mongodb://mongo:27017/interview}}
      - AUTH_SERVICE_URL=http://auth:8001
      - GROQ_API_KEY=${GROQ_API_KEY}
      - CODEBOX_URL=${CODEBOX_URL:-http://localhost:3000}
      - CODEBOX_AUTH_TOKEN=${CODEBOX_AUTH_TOKEN:-}
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET:?}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?}
    depends_on:
      redis:
        condition: service_healthy
      auth:
        condition: service_started

  roadmap:
    build:
      context: .
      dockerfile: services/roadmap/Dockerfile
    container_name: yugam-roadmap
    restart: unless-stopped
    expose:
      - "8004"
    environment:
      - PORT=8004
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - MONGODB_URL=${MONGODB_URL_ROADMAP:-${MONGODB_URL:-mongodb://mongo:27017/Roadmap}}
      - AUTH_SERVICE_URL=http://auth:8001
      - GROQ_API_KEY=${GROQ_API_KEY}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET:?}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?}
    depends_on:
      redis:
        condition: service_healthy
      auth:
        condition: service_started

  billing:
    build:
      context: .
      dockerfile: services/billing/Dockerfile
    container_name: yugam-billing
    restart: unless-stopped
    expose:
      - "8005"
    environment:
      - PORT=8005
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - MONGODB_URL=${MONGODB_URL_BILLING:-${MONGODB_URL:-mongodb://mongo:27017/Billing}}
      - AUTH_SERVICE_URL=http://auth:8001
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET:?}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?}
    depends_on:
      redis:
        condition: service_healthy
      auth:
        condition: service_started

volumes:
  redis_data:
    driver: local
