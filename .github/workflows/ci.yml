name: Yugam CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Test Suite & Security Regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            backend/gateway/package-lock.json
            backend/services/*/package-lock.json

      - name: Install Backend & Microservice Dependencies
        run: |
          npm ci --prefix backend
          if [ -f "backend/gateway/package-lock.json" ]; then
            npm ci --prefix backend/gateway
          else
            npm install --no-audit --no-fund --prefix backend/gateway
          fi
          for dir in backend/services/*; do
            if [ -f "$dir/package.json" ]; then
              if [ -f "$dir/package-lock.json" ]; then
                npm ci --prefix "$dir"
              else
                npm install --no-audit --no-fund --prefix "$dir"
              fi
            fi
          done

      - name: Run Backend Tests
        run: npm test --prefix backend
        env:
          NODE_ENV: test
          GATEWAY_INTERNAL_SECRET: test-gateway-secret-2026
          INTERNAL_SERVICE_SECRET: test-internal-secret-2026

  frontend-build:
    name: Frontend Build & Type Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend

      - name: Build Frontend Application
        run: npm run build --prefix frontend
